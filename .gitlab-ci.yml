stages:
  - package
  - release

create_zip:
  stage: package
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache zip curl
  script:
    - |
      for folder in smartypants pta-cleanup; do
        zip -r "${folder}.zip" $folder/
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/releases/${CI_COMMIT_TAG}/${folder}.zip"
        curl --fail --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${folder}.zip" "${url}"
      done
  artifacts:
    paths:
      - "*.zip"
    expire_in: 1 day

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: create_zip
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      file1="smartypants.zip"
      file2="pta-cleanup.zip"
      url1="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/releases/${CI_COMMIT_TAG}/${file1}"
      url2="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/releases/${CI_COMMIT_TAG}/${file2}"

      glab release create "$CI_COMMIT_TAG" \
        --name "Release ${CI_COMMIT_TAG}" \
        --notes "Release ${CI_COMMIT_TAG}" \
        --assets-links "[{\"name\":\"${file1}\",\"url\":\"${url1}\",\"link_type\":\"package\"},{\"name\":\"${file2}\",\"url\":\"${url2}\",\"link_type\":\"package\"}]"
