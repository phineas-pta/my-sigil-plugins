name: Build plugins

on:
  release:
    types:
    - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          for folder in smartypants pta-cleanup vi-word2int; do
            zip -r "${folder}.zip" "${folder}/"
          end
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
